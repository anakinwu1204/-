<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台股大盤風險儀表板</title>
  <link rel="stylesheet" href="/dashboard/style.css?v=2">
  <style>.market-now{grid-template-columns:repeat(4,1fr);min-width:55%}.header-actions{display:grid;justify-items:end;gap:9px}.nav-links{display:flex;gap:14px}.nav-link{color:#3ee0c2;text-decoration:none;font-size:13px;font-weight:700}.nav-link.short{color:#ff647c}.nav-link:hover{text-decoration:underline}</style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">TAIWAN MARKET PULSE</p><h1>台股大盤風險儀表板</h1></div>
      <div class="header-actions"><div class="nav-links"><a class="nav-link" href="/dashboard/entry.html">做多提醒 →</a><a class="nav-link short" href="/dashboard/short.html">做空提醒 →</a></div><div class="asof"><span class="live-dot"></span><span id="asof">讀取資料中</span></div></div>
    </header>

    <section class="hero panel">
      <div class="gauge-wrap">
        <div class="gauge" id="gauge"><div class="gauge-inner"><strong id="total">--</strong><span>/ 100</span></div></div>
        <div><p class="muted">目前市場狀態</p><h2 id="level">--</h2><p id="summary" class="summary">正在分析四大風險維度</p></div>
      </div>
      <div class="market-now">
        <div><span>加權指數</span><strong id="close">--</strong><small id="dailyReturn">--</small></div>
        <div><span>季線乖離</span><strong id="distance">--</strong><small id="ma60">--</small></div>
        <div><span>前日交易量比</span><strong id="volumeRatio">--</strong><small id="volumeRatio20">20日量比 --</small></div>
        <div><span>券資比</span><strong id="shortMarginRatio">--</strong><small>融券餘額 ÷ 融資餘額</small></div>
      </div>
    </section>

    <section class="score-grid" id="scoreGrid"></section>

    <section class="charts-grid">
      <article class="panel chart-panel wide"><div class="panel-title"><div><p class="eyebrow">MARKET TREND</p><h3>指數與均線</h3></div><div class="legend"><i class="close"></i>指數 <i class="ma60"></i>季線 <i class="ma120"></i>半年線</div></div><canvas id="marketChart"></canvas></article>
      <article class="panel chart-panel"><div class="panel-title"><div><p class="eyebrow">RISK HISTORY</p><h3>風險分數趨勢</h3></div></div><canvas id="riskChart"></canvas></article>
      <article class="panel flow-panel"><div class="panel-title"><div><p class="eyebrow">INSTITUTIONAL FLOW</p><h3>三大法人買賣超</h3></div><small>最新交易日／億元</small></div><div id="flows"></div></article>
    </section>
    <footer>資料來源：臺灣證券交易所公開資訊 · 市場加權融資維持率為個股融資市值彙總推估，非證交所官方彙總值 · 本模型不構成投資建議</footer>
  </main>
  <div id="error" class="error" hidden></div>
  <script src="/dashboard/app.js?v=8"></script>
</body>
</html>
