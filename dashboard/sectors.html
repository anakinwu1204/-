<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台股產業族群盤勢</title>
  <link rel="stylesheet" href="/dashboard/style.css?v=2">
  <style>
    .back{color:var(--teal);text-decoration:none;font-size:13px;font-weight:700}
    .sector-summary{padding:26px;margin-bottom:14px}.sector-summary p{color:var(--muted);line-height:1.7}
    .leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
    .leader{padding:20px;border-top:3px solid var(--sector-color)}.leader small{color:var(--muted)}
    .leader strong{display:block;font-size:24px;margin:8px 0}.leader span{font-size:12px;color:var(--muted)}
    .sector-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .sector-card{padding:19px;position:relative;overflow:hidden;border-top:3px solid var(--card-color);transition:.2s}
    .sector-card.clickable{cursor:pointer}.sector-card.clickable:hover{transform:translateY(-3px);border-color:var(--card-color);box-shadow:0 18px 45px rgba(0,0,0,.28)}
    .sector-card-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.sector-card h4{font-size:19px;margin:0}.sector-score{text-align:right}.sector-score strong{display:block;font-size:26px;color:var(--card-color)}.sector-score small{color:var(--muted)}
    .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}.metric{background:#0a1727;border:1px solid var(--line);padding:10px;border-radius:10px}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:4px;font-size:14px}
    .member-list{color:var(--muted);font-size:11px;line-height:1.55;min-height:34px}.drill-hint{color:var(--teal);font-size:11px;font-weight:800;margin-top:8px}
    .stock-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.stock-box{background:#091525;border:1px solid var(--line);border-left:3px solid var(--stock-color);border-radius:10px;padding:10px;min-width:0}.stock-box strong{display:block;color:#dce8f7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stock-box .stock-price{font-size:16px;font-weight:800;margin:7px 0 3px;color:#eef5ff}.stock-box .stock-move{font-size:11px;font-weight:800;color:var(--stock-color)}
    .tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}
    .meter{width:90px;height:6px;background:#26374d;border-radius:9px;overflow:hidden;display:inline-block}
    .meter i{display:block;height:100%;background:var(--meter);width:var(--width)}
    .drillbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.drillbar h3{margin:0}.back-list{border:1px solid var(--teal);background:transparent;color:var(--teal);padding:8px 13px;border-radius:999px;cursor:pointer;font-weight:700}.sector-link{color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.sector-link small{color:var(--muted);text-decoration:none}
    .grid-title{display:flex;align-items:center;gap:12px;margin:0 0 16px}.grid-title:after{content:"";height:1px;background:var(--line);flex:1}.grid-title h3{margin:0;white-space:nowrap}.grid-title small{color:var(--muted);white-space:nowrap}
    @media(max-width:980px){.sector-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.leaders,.sector-grid{grid-template-columns:1fr}.shell{width:calc(100% - 20px)}}
  </style>
</head>
<body><main class="shell">
  <header><div><p class="eyebrow">SECTOR ROTATION</p><h1>產業族群盤勢分析</h1></div><a class="back" href="/">← 返回風險儀表板</a></header>
  <section class="panel sector-summary"><h2 id="headline">讀取族群資料</h2><p id="summary">比較各細分族群5日／20日動能，以及相對加權指數的強弱。</p><div class="asof" id="asof">--</div></section>
  <div class="drillbar"><h3 id="viewTitle">細分族群盤勢</h3><button class="back-list" id="backToSectors" hidden>← 返回</button></div>
  <section class="leaders" id="leaders"></section>
  <div class="grid-title"><h3 id="gridTitle">全部細分族群</h3><small id="gridHint">依市況調整後強弱分排序</small></div>
  <section class="sector-grid" id="sectorRows"></section>
  <footer>資料來源：臺灣證券交易所產業類股指數 · 強弱分為相對動能指標，不構成投資建議</footer>
</main><div id="error" class="error" hidden></div><script src="/dashboard/sectors.js?v=21"></script></body></html>
