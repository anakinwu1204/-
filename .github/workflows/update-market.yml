name: Update TWSE market data

on:
  schedule:
    # 19:10起逐時嘗試更新；融資融券資料約21:00產生，最晚22:10補抓。
    - cron: "10 11 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-market.yml"

permissions:
  contents: write

concurrency:
  group: update-twse-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest TWSE data
        run: python3 twse_scraper.py --months 8 --limit 140 --delay 0.25 --output market.csv

      - name: Fetch industry index data
        run: python3 sector_scraper.py --market market.csv --limit 45 --delay 0.2 --output sectors.csv

      - name: Fetch thematic group data
        run: python3 theme_scraper.py --market market.csv --limit 45 --delay 0.2 --output themes.csv

      - name: Commit updated data
        run: |
          if git diff --quiet -- market.csv sectors.csv themes.csv; then
            echo "No new complete trading-day data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.csv sectors.csv themes.csv
          git commit -m "Update TWSE market data"
          git push
